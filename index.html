<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optical Audio Receiver</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07100b;color:#eaffea;font-family:Arial,sans-serif;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
video{width:min(94vw,720px);background:#000;border:3px solid #244;border-radius:6px;display:block;margin:12px auto}
.btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
button{font-size:17px;padding:11px 22px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
#btnStart{background:#1a7a3a;color:#fff}
#btnStart:hover{background:#22a34e}
#btnStop{background:#5a1a1a;color:#fff}
#btnStop:hover{background:#8a2222}
.info{padding:12px 16px;background:#102016;border-radius:10px;margin:10px auto;max-width:720px;font-size:15px;line-height:1.5}
.warn{background:#1e1a08;border:1px solid #6b5a00;border-radius:8px;padding:10px;margin:10px auto;max-width:720px;font-size:14px;color:#e6d87a;display:none}
#stats{font-size:13px;color:#7ab890;margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>📷 Optical Audio Receiver</h1>
  <div class="warn" id="httpsWarn">
    ⚠️ Kamera faqat <b>HTTPS</b> yoki <b>localhost</b> da ishlaydi. Iltimos, xavfsiz ulanishdan foydalaning.
  </div>
  <div class="btns">
    <button id="btnStart">▶ Kamera + Ijro</button>
    <button id="btnStop">⏹ To'xtatish</button>
  </div>
  <div class="info" id="status">Kamerani transmitter ekraniga qarating.</div>
  <div id="stats"></div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="cv" width="320" height="240" hidden></canvas>
</main>
<script>
const W=40, H=32, BYTES=256, PAYLOAD=251;
const video = document.getElementById('video');
const cv    = document.getElementById('cv');
const ctx   = cv.getContext('2d', {willReadFrequently: true});
const elStatus = document.getElementById('status');
const elStats  = document.getElementById('stats');
const elHttps  = document.getElementById('httpsWarn');

// HTTPS tekshiruvi
if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  elHttps.style.display = 'block';
}

let stream = null, raf = null, running = false, lastSeq = -1;
let audio = null; // AudioContext faqat foydalanuvchi bosganda yaratiladi
let nextTime = 0;
let decodedFrames = 0, goodFrames = 0;
let lastFrameTime = 0;
const FRAME_INTERVAL = 50; // ms — 20fps decode (60fps o'rniga)

function say(t) { elStatus.textContent = t; }

function crc8(a) {
  let c = 0;
  for (const v of a) {
    c ^= v;
    for (let i = 0; i < 8; i++) c = (c & 128) ? ((c << 1) ^ 7) : (c << 1);
    c &= 255;
  }
  return c;
}

function readCell(img, gx, gy) {
  const sx = Math.floor((gx + .5) * img.width / W);
  const sy = Math.floor((gy + .5) * img.height / H);
  let sum = 0, n = 0;
  for (let y = Math.max(0, sy-2); y < Math.min(img.height, sy+3); y++) {
    for (let xx = Math.max(0, sx-2); xx < Math.min(img.width, xx+3); xx++) {
      const p = (y * img.width + xx) * 4;
      sum += (img.data[p] + img.data[p+1] + img.data[p+2]) / 3;
      n++;
    }
  }
  return (n > 0 && sum/n > 128) ? 1 : 0;
}

function decode() {
  const now = performance.now();
  // Throttle: har 50ms da bir marta decode
  if (now - lastFrameTime < FRAME_INTERVAL) return;
  lastFrameTime = now;

  cv.width  = 400;
  cv.height = Math.max(240, Math.round(400 * (video.videoHeight / video.videoWidth || 0.75)));
  ctx.drawImage(video, 0, 0, cv.width, cv.height);
  const img = ctx.getImageData(0, 0, cv.width, cv.height);

  const packet = new Uint8Array(BYTES);
  let k = 0;
  for (let gy = 1; gy < H-1 && k < BYTES*8; gy++) {
    for (let gx = 1; gx < W-1 && k < BYTES*8; gx++) {
      packet[k>>3] |= readCell(img, gx, gy) << (7-(k&7));
      k++;
    }
  }

  decodedFrames++;

  // Magic bytes tekshiruvi
  if (packet[0] !== 0xA5 || packet[1] !== 0x5A) return;
  // CRC tekshiruvi
  if (crc8(packet.slice(0, BYTES-1)) !== packet[BYTES-1]) return;

  const seq = packet[2] | (packet[3] << 8);

  // Sequence gap — eski qiymatni tiklash
  if (lastSeq >= 0) {
    const gap = (seq - lastSeq + 65536) & 65535;
    if (gap > 2000) { lastSeq = seq; return; } // juda katta sakrash — sinxron yo'qolgan
  }
  lastSeq = seq;
  goodFrames++;
  elStats.textContent = `Qabul qilingan: ${goodFrames} | Urinish: ${decodedFrames} | SNR: ${(goodFrames/decodedFrames*100).toFixed(0)}%`;

  const pcm = new Float32Array(PAYLOAD);
  for (let i = 0; i < PAYLOAD; i++) pcm[i] = (packet[i+4] / 127.5) - 1;
  playChunk(pcm, 8000);
}

function playChunk(samples, sr) {
  if (!audio) return;
  const b = audio.createBuffer(1, samples.length, sr);
  b.copyToChannel(samples, 0);
  const s = audio.createBufferSource();
  s.buffer = b;
  s.connect(audio.destination);
  if (nextTime < audio.currentTime + 0.03) nextTime = audio.currentTime + 0.03;
  s.start(nextTime);
  nextTime += b.duration;
}

function loop() {
  if (!running) return;
  decode();
  raf = requestAnimationFrame(loop);
}

document.getElementById('btnStart').onclick = async () => {
  // AudioContext foydalanuvchi gesturasi ichida yaratiladi
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }

  try {
    // Avval kamera ruxsatini so'rash
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    await audio.resume();

    running = true;
    decodedFrames = 0;
    goodFrames = 0;
    lastSeq = -1;
    nextTime = audio.currentTime + 0.1;
    say('🟢 JONLI — kamera oqimni o\u02BCqimoqda');
    loop();
  } catch(e) {
    // Xato turini aniqlab ko'rsatish
    let msg = 'Kamera xatosi: ';
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      msg = '❌ Kamera ruxsati rad etildi. Brauzer sozlamalaridan ruxsat bering va sahifani yangilang.';
    } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
      msg = '❌ Kamera topilmadi. Qurilmada kamera mavjudligini tekshiring.';
    } else if (e.name === 'NotReadableError') {
      msg = '❌ Kamera boshqa dastur tomonidan band. Boshqa ilovalarni yoping.';
    } else if (e.name === 'OverconstrainedError') {
      msg = '❌ Kamera so\u02BCralgan sifatni qo\u02BCllab-quvvatlamaydi. Qurilmani tekshiring.';
    } else {
      msg += e.message;
    }
    say(msg);
  }
};

document.getElementById('btnStop').onclick = () => {
  running = false;
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  say('To\u02BCxtatildi');
  elStats.textContent = '';
};
</script>
</body>
  </html>
